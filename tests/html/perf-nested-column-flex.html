<!DOCTYPE html>
<!--
  Slow layout with nested column flex containers.

  A long list (N rows, default 1600) sits in a scroller at the bottom of
  three nested wrappers. With `?nesting=k` the outer k wrappers are
  `display: flex; flex-direction: column` (children `flex: 1; min-height: 0`);
  the rest are `display: block` with explicit heights. `nesting=0` is all
  block. The list's content and the scroller's size are the same in every
  variant.

  Each measurement changes one character of a text node outside the list,
  then forces layout by reading `document.body.offsetHeight`, timed with
  `performance.now()`; 10 runs, median reported. With no `nesting` param the
  page runs all four levels in sequence and prints a table (also to
  console.log and document.title).

  URL params: rows=N, nesting=0|1|2|3, row=block|grid|flex (row display, default block).

  Measured, 1600 rows, median ms per forced layout (Linux x86_64):

    nesting           Servo 0.6.0   Chromium (headless)
    0 (all block)          5            <= 0.1
    1                     50            <= 0.1
    2                    135            <= 0.1
    3                    300            <= 0.1
    3, list hidden         0.1          <= 0.1

  Each column flex level multiplies the cost by ~2-2.5x. Row display
  (block, grid or flex) makes no difference. In the app this is reduced
  from (a code diff viewer, 1480 ms vs 84 ms per layout), a profile of the
  script thread is almost all nested FlexContainer::layout, up to 25 frames
  deep: a column flex item's content is laid out again to size it, and the
  nesting compounds.
-->
<meta charset="utf-8">
<title>perf: nested column flex</title>
<style>
  html, body { margin: 0; height: 100%; font: 12px/1.5 monospace; }
  #out { position: fixed; right: 0; top: 0; z-index: 1; margin: 0; padding: 8px;
         background: #ffe; border: 1px solid #999; white-space: pre; }
  #root { height: 100vh; }
  .flex { display: flex; flex-direction: column; min-height: 0; }
  .flex > * { flex: 1; min-height: 0; }
  .block { display: block; }
  .block > * { height: 100%; }
  .toolbar { height: 33px; flex: none !important; }
  .block > .scroll { height: calc(100% - 33px); }
  .scroll { overflow: auto; }
  .row { display: grid; grid-template-columns: 40px 40px minmax(0, 1fr); }
  .row.f { display: flex; }
  .row.b { display: block; }
  .row.b > .num { display: inline-block; width: 40px; }
  .row.f > .num { flex: none; width: 40px; }
  .row.f > .code { flex: 1; min-width: 0; }
  .num { text-align: right; padding-inline: 8px; }
  .code { white-space: pre; }
  .k { color: #a0a; } .s { color: #080; } .c { color: #888; }
</style>
<pre id="out">running…</pre>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const ROWS = parseInt(params.get("rows") || "1600", 10);
const ROW = params.get("row") || "block";
const RUNS = 10;
const out = document.getElementById("out");
const root = document.getElementById("root");

function build(nesting, hideList) {
  root.textContent = "";
  let parent = root;
  // Three wrappers, outermost first; the outer `nesting` are column flexes.
  for (let i = 0; i < 3; i++) {
    const w = document.createElement("div");
    w.className = i < nesting ? "flex" : "block";
    parent.appendChild(w);
    parent = w;
  }
  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const label = document.createTextNode("file.rs a");
  toolbar.appendChild(label);
  const scroll = document.createElement("div");
  scroll.className = "scroll";
  if (hideList) scroll.hidden = true;
  const frag = document.createDocumentFragment();
  for (let n = 1; n <= ROWS; n++) {
    const row = document.createElement("div");
    row.className = ROW === "flex" ? "row f" : ROW === "block" ? "row b" : "row";
    row.innerHTML =
      `<span class="num">${n}</span><span class="num">${n}</span>` +
      `<span class="code"><span class="k">let</span> x${n} = ` +
      `<span class="s">"value ${n}"</span>; <span class="c">// line ${n}</span></span>`;
    frag.appendChild(row);
  }
  scroll.appendChild(frag);
  parent.appendChild(toolbar);
  parent.appendChild(scroll);
  document.body.offsetHeight; // first layout, not timed
  return label;
}

function measure(nesting, hideList) {
  const label = build(nesting, hideList);
  const times = [];
  for (let r = 0; r < RUNS; r++) {
    label.data = "file.rs " + String.fromCharCode(98 + (r % 20));
    const t0 = performance.now();
    document.body.offsetHeight;
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  return (times[RUNS / 2 - 1] + times[RUNS / 2]) / 2;
}

const variants = params.has("nesting")
  ? [[parseInt(params.get("nesting"), 10), false]]
  : [[0, false], [1, false], [2, false], [3, false], [3, true]];
const lines = [`rows=${ROWS} row=${ROW}  median of ${RUNS} forced layouts`];
let i = 0;
function next() {
  if (i === variants.length) {
    const text = lines.join("\n");
    out.textContent = text;
    console.log("PERF-RESULT " + text.replace(/\n/g, " | "));
    document.title = "DONE " + lines.slice(1).join("; ");
    return;
  }
  const [nesting, hide] = variants[i++];
  const ms = measure(nesting, hide);
  const line = `nesting=${nesting}${hide ? " (list hidden)" : ""}: ${ms.toFixed(1)} ms`;
  lines.push(line);
  console.log("PERF " + line);
  out.textContent = lines.join("\n") + "\n…";
  setTimeout(next, 50);
}
setTimeout(next, 50);
</script>
